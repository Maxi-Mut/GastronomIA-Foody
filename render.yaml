services:
  - type: web
    name: gastronomia-mvp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Si tu app usa una API Key (ej. OpenAI o Gemini), la agregarás manualmente en el panel de Render, NO aquí.

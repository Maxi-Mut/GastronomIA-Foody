[project]
name = "gastronomia"
version = "1.0.0"
description = "GastronomIA - Asistente gastronomico CABA y GBA"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "requests",
    "google-genai",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.fastapi.static]
cdn = false
